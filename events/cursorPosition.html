<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body
        {
            width:100vh;
            height: 100vh;
        }
        div {
            
            width:100vw;
            height: 100vh;
            display: flex;
            text-align: center;
            justify-content: center;
            border:2px solid red;
            cursor: pointer;
        }
    </style>
</head>

<body >

    <div onmousemove="getcursorPosition(event)">
        <h1 id="data"></h1>
    </div>

    <script>
        let xpos;
        let yPos;
        let data = document.getElementById("data")
        function getcursorPosition(event) {
            xpos = event.clientX;
            yPos = event.clientY;

            data.innerText = "X : " + xpos + " px\nY : " + yPos + " px";
        }
    </script>
</body>

</html>
