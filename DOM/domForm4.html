<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>


    <!DOCTYPE html>
    <html>

    <head>
        <title>Product Form</title>
    </head>

    <body>

        <h2>Product Registration Form</h2>

        <form name="product">

            <!-- Product Name -->
            <label>Product Name:</label>
            <input type="text" placeholder="Enter Product Name" name="pname">
            <br><br>

            <!-- Category -->
            <label>Category:</label>
            <select name="category">
                <option>Select Category</option>
                <option>Electronics</option>
                <option>Clothing</option>
                <option>Books</option>
                <option>Furniture</option>
            </select>
            <br><br>

            <!-- Description -->
            <label>Description:</label>
            <textarea rows="4" cols="30" placeholder="Enter Product Description" name="desc"></textarea>
            <br><br>

            <!-- Price -->
            <label>Price:</label>
            <input type="number" placeholder="Enter Price" name="price">
            <br><br>

            <!-- Product Type -->
            <label>Product Type:</label>
            <input type="radio" name="type" value="New"> New
            <input type="radio" name="type" value="Old"> Old
            <br><br>

            <!-- Available Colors -->
            <label>Available Colors:</label>
            <input type="checkbox" value="Red" name="colors"> Red
            <input type="checkbox" value="Blue" name="colors"> Blue
            <input type="checkbox" value="Black" name="colors"> Black
            <input type="checkbox" value="White" name="colors"> White
            <br><br>

            <!-- Buttons -->
            <input type="button" value="Submit" onclick="getData()">
            <input type="reset" value="Reset">

        </form>

        <h3 id="data"></h3>

        <script>
            let data = document.getElementById("data")

            function getData() {
                let category = document.product.category;
                let desc = document.product.desc;
                let price = document.product.price;
                let type = document.product.type
                let colors = document.product.colors
                let productName = document.product.pname;
                let d = []

                for (let i = 0; i < colors.length; i++) {
                    if (colors[i].checked) {
                        d.push(colors[i].value)
                    }
                }       
                data.innerText = "Product Name : " + productName.value+ 
                                "\nCategory : " + category.value + 
                                "\nDescription : " + desc.value + 
                                "\nPrice  : "  + price.value +
                                "\nType : " + type.value +
                                "\nColors : " + d 
            
            }




        </script>

    </body>

    </html>
</body>

</html>
