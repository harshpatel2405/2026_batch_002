<body>
    <div class="container">
        <form>
            <h1>Welcome back</h1>
            <p>Login to Continue</p>
            <label>Username</label>
            <input type="text" id="uname">
            <label>Password</label>
            <input type="password" id="pwd">

            <input type="button" value="Log In" onclick="login()">
        </form>
        <h3 id="data"></h3>
    </div>

    <script>
        let username = "demo1123"
        let password = "demo1123@345"

        let data = document.getElementById("data")
        
        
        function login() {
            let uname = document.getElementById("uname")
            let pwd = document.getElementById("pwd")
            uname = uname.value.trim()
            pwd = pwd.value
            if (uname == "") {
                data.innerText = "Username is Required"
                return false;
            }

            if (pwd == "") {
                data.innerText = "Password is Required"
                return false;
            }

            if (pwd.length < 8) {
                data.innerText = "Password should be more than 8 characters"
                return false;
            }

            if (uname == username && pwd == password)
                data.innerText = "Login Successfull"
            else
                data.innerText = "Invalid Credentials"

        }
    </script>
</body>
