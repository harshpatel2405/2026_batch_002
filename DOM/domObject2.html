        function getData() {
            let div = document.getElementById("data")
            let table = document.createElement("table")

            let headerRow = document.createElement("tr");
            let header1 = document.createElement("th");
            header1.innerText = "ID";
            let header2 = document.createElement("th");
            header2.innerText = "Name";
            let header3 = document.createElement("th");
            header3.innerText = "Price";
            let header4 = document.createElement("th");
            header4.innerText = "Color";
            let header5 = document.createElement("th");
            header5.innerText = "Model No";

            headerRow.appendChild(header1);
            headerRow.appendChild(header2);
            headerRow.appendChild(header3);
            headerRow.appendChild(header4);
            headerRow.appendChild(header5);

            table.appendChild(headerRow)


            let limit = Number(document.getElementById("num").value);

            if (limit > data.length || limit <= 0) {
                let warning = document.createElement("h2");
                warning.innerText = limit > data.length ? "Length should be less than " + data.length : "Length should be greater than 0"
                warning.style.color = "red"
                div.innerHTML = ""
                div.appendChild(warning)
                return
            }

            console.log(limit)
            for (let i = 0; i < parseInt(limit); i++) {

                let row = document.createElement("tr")
                let id = document.createElement("td")
                id.innerText = data[i].id
                let pname = document.createElement("td")
                pname.innerText = data[i].productName
                let price = document.createElement("td")
                price.innerText = data[i].price
                let color = document.createElement("td")
                color.innerText = data[i].color
                let modelNo = document.createElement("td")
                modelNo.innerText = data[i].modelNo

                row.appendChild(id)
                row.appendChild(pname)
                row.appendChild(price)
                row.appendChild(color)
                row.appendChild(modelNo)

                table.appendChild(row)

            }

            table.setAttribute('border', 1)
            table.style.border = "2px solid black";
            table.style.borderCollapse = "collapse";
            table.style.width = "80%";
            table.style.margin = "20px auto";
            table.style.backgroundColor = "#f8f9fa";
            table.style.color = "#333";
            table.style.fontFamily = "Arial";
            table.style.fontSize = "16px";
            table.style.textAlign = "center";
            table.style.boxShadow = "0 0 10px rgba(0,0,0,0.2)";

            div.innerHTML = ""
            div.appendChild(table)
