<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form>
        <label for="fn">Enter First Number : </label>
        <input type="number" id="fn" required>
        <br>
        <br>
        <label for="sn">Enter Second Number : </label>
        <input type="number" id="sn" required>

        <br>
        <br>
        <button type="button" onclick="addNumber()">Add Two Numbers</button>
        <button type="button" onclick="subtractNumber()">Subtract Two Numbers</button>

        <p id="data"></p>


        <script>
            let fn = document.getElementById("fn")
            let sn = document.getElementById("sn")
            let data = document.getElementById("data")

            function addNumber() {
                let ans = parseInt(fn.value) + parseInt(sn.value);
                data.innerText = "Addition of " + fn.value + " and " + sn.value + " is " + ans
            }
            function subtractNumber() {
                let ans = parseInt(fn.value) - parseInt(sn.value);
                data.innerText = "Subtraction of " + fn.value + " and " + sn.value + " is " + ans
            }
        </script>
    </form>
</body>

</html>
