<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            font-family: Arial, sans-serif;
        }

        /* ========================= MAIN STOPWATCH ========================= */
        .stopwatch {
            width: 500px;
            max-height: 90vh;
            padding: 40px;
            background: #1e293b;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.05);
        }

        /* ========================= TITLE ========================= */
        .stopwatch h1 {
            margin: 0 0 30px 0;
            color: white;
            font-size: 30px;
            letter-spacing: 2px;
        }

        /* ========================= DIGITAL DISPLAY ========================= */
        #data {
            margin: 0 0 30px 0;
            padding: 25px 15px;
            background: #020617;
            color: #00ff88;
            border: 2px solid #00ff88;
            border-radius: 15px;
            font-family: monospace;
            font-size: 42px;
            letter-spacing: 4px;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.25), inset 0 0 20px rgba(0, 255, 136, 0.05);
        }

        /* ========================= BUTTON AREA ========================= */
        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        /* ========================= ALL BUTTONS ========================= */
        button {
            flex: 1;
            padding: 13px 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: scale(0.95);
        }

        /* ========================= START ========================= */
        #btn1 {
            background: #00c853;
            box-shadow: 0 5px 15px rgba(0, 200, 83, 0.3);
        }

        #btn1:hover {
            background: #00e676;
            box-shadow: 0 8px 20px rgba(0, 230, 118, 0.4);
        }

        /* ========================= RESET ========================= */
        #btn2 {
            background: #475569;
        }

        #btn2:hover {
            background: #64748b;
        }

        /* ========================= LAP ========================= */
        #btn3 {
            background: #2563eb;
            box-shadow: 0 5px 15px rgba(37, 99, 235, 0.3);
        }

        #btn3:hover {
            background: #3b82f6;
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
        }

        /* ========================= LAP CONTAINER ========================= */
        #laps {
            max-height: 250px;
            overflow-y: auto;
            padding: 5px;
        }

        /* Scrollbar */
        #laps::-webkit-scrollbar {
            width: 6px;
        }

        #laps::-webkit-scrollbar-track {
            background: #0f172a;
            border-radius: 10px;
        }

        #laps::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 10px;
        }

        #laps::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        /* ========================= LAP TITLE ========================= */
        #laps::before {
            content: "Lap History";
            display: block;
            color: #94a3b8;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        /* ========================= LAP RECORD ========================= */
        #laps p {
            margin: 8px 0;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            color: #e2e8f0;
            border: 1px solid #334155;
            border-radius: 8px;
            font-family: monospace;
            font-size: 16px;
            transition: 0.2s;
        }

        #laps p:hover {
            background: #1e293b;
            border-color: #475569;
            transform: translateX(3px);
        }

        /* ========================= MOBILE ========================= */
        @media (max-width: 550px) {
            body {
                padding: 20px;
            }

            .stopwatch {
                width: 100%;
                padding: 30px 20px;
            }

            .stopwatch h1 {
                font-size: 25px;
            }

            #data {
                font-size: 30px;
                letter-spacing: 2px;
                padding: 20px 10px;
            }

            .buttons {
                gap: 8px;
            }

            button {
                padding: 12px 8px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <div class="stopwatch">
        <h1>⏱ Stopwatch</h1>
        <h2 id="data">0 :: 0 :: 0</h2>
        <div class="buttons"> <button id="btn1"> Start </button> <button id="btn2"> Reset </button> <button id="btn3">
                Lap </button> </div>
        <div id="laps"> </div>
    </div>
    <script> let data = document.querySelector("#data")
        let laps = document.querySelector("#laps")
        let count = 1
        let seconds = 0
        let timer
        function stopwatch() {
            let hours = Math.floor(seconds / 3600)
            let minutes = Math.floor((seconds % 3600) / 60)
            let sec = seconds % 60
            data.innerHTML = hours + " :: " + minutes + " :: " + sec
            seconds++
            if (seconds >= 15) { clearInterval(timer) }
        }
        let button1 = document.getElementById("btn1")
        let button2 = document.getElementById("btn2")
        let button3 = document.getElementById("btn3")
        // START 
        button1.addEventListener("click", () => { timer = setInterval(stopwatch, 1000) })

        // RESET 
        button2.addEventListener("click", () => {
            seconds = 0
            clearInterval(timer)
            data.innerHTML = "0 :: 0 :: 0"
            laps.innerHTML = ""
            count = 1
        })
        // LAP
        button3.addEventListener("click", () => {
            let hours = Math.floor(seconds / 3600)
            let minutes = Math.floor((seconds % 3600) / 60)
            let sec = seconds % 60
            let bold1 = document.createElement("p")
            bold1.innerHTML = "<span>Lap " + count++ + "</span>" + "<span>" + hours + " :: " + minutes + " :: " + sec + "</span>"
            laps.append(bold1)
        }) 
    </script>
</body>

</html>
